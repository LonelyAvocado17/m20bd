<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>big dawg's birthday</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* CONFESSION ONLY VIEW */
#confession{
    width:90%;
    max-width:600px;
    text-align:left;
    font-size:18px;
    line-height:1.6;
    background:rgba(255,255,255,0.1);
    padding:25px;
    border-radius:15px;
    color:#fff;
    white-space:pre-wrap;
    margin:40px auto;
}
</style>
</head>

<body>

<div id="app">
    <!-- everything loads here -->
</div>

<script>
// SIMPLE AUDIO (kept)
function play(){}

// 🔥 MAIN FIX: HARD RESET UI
function checkCode() {
    const code = prompt("Enter code").toLowerCase();

    if (code === "pineapple") {
        showConfession();
    } else {
        alert("Wrong code");
    }
}

// 🔥 THIS IS THE IMPORTANT PART
function showConfession() {

    // 💣 wipe EVERYTHING
    document.body.innerHTML = "";

    // recreate clean body
    document.body.style.background = "black";

    // create confession container
    const confessionDiv = document.createElement("div");
    confessionDiv.id = "confession";
    document.body.appendChild(confessionDiv);

    const confessionText = `This is the last menu I swear lol, it's nice that you were able to decrypt that. Now... how do I start? 

Remember the day your roommates were like it's high time that you confess and all and you were like I am going to the common room lmao, usually i would have had done so but i had this package already sent beforehand. so now i am actually doing it here... 

Manya, would you like to be my girlfriend? I really like you. Like, more than just as a friend. And honestly… I'm so in love with you 👉👈.

What do you think of me? You're my twin aswell. I know it'd be long distance, and I can't promise everything will be perfect but i really think we can make it work. 

i guess it would be late enough by the time you read this that i would've slept to avoid anxiety😋 so text me whatever you feel like and we'll talk through it in the morning.`;

    // typewriter effect (same vibe)
    let i = 0;
    const typeWriter = setInterval(() => {
        if (i < confessionText.length) {
            confessionDiv.innerText += confessionText[i];
            i++;
        } else {
            clearInterval(typeWriter);
        }
    }, 30);
}

// start immediately
checkCode();
</script>

</body>
</html>
