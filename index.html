<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>big dawg's birthday</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* Loading Screen */
#loadingScreen {
    position:fixed;
    width:100vw;
    height:100vh;
    background:black;
    z-index:1000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.loader {
    border:5px solid #333;
    border-top:5px solid white;
    border-radius:50%;
    width:50px;
    height:50px;
    animation:spin 1s linear infinite;
    margin-bottom:20px;
}

.progress-bar {
    width:200px;
    height:10px;
    background:#333;
    border-radius:5px;
    margin-top:20px;
    overflow:hidden;
}

.progress-fill {
    height:100%;
    background:white;
    width:0%;
    transition:width 0.3s;
}

@keyframes spin {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
}

/* Screens */
.screen{
    position:fixed;
    width:100vw;
    height:100vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

.center{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    min-height:100vh;
    padding:20px;
    box-sizing:border-box;
}

.hidden{ display:none !important; }

input, textarea{
    width:80%;
    max-width:300px;
    padding:15px;
    border-radius:25px;
    border:none;
    margin-top:10px;
    font-size:16px;
    -webkit-appearance:none;
}

button{
    margin-top:15px;
    padding:12px 30px;
    border-radius:25px;
    border:none;
    background:white;
    cursor:pointer;
    font-size:16px;
    -webkit-appearance:none;
}

.secondary{ background:#666; color:white; }

#textDisplay{
    position:absolute;
    top:40%;
    width:100%;
    text-align:center;
    font-size:22px;
    padding:0 20px;
    box-sizing:border-box;
}

/* Running Cat */
.runningCat{
    position:absolute;
    width:70px;
    animation:runCat 20s linear infinite;
    top:10%;
    z-index:10;
}

@keyframes runCat{
    from{ left:-100px; }
    to{ left:100%; }
}

/* Floating Cats */
.cat{
    position:absolute;
    width:60px;
    opacity:0.9;
    animation:floatCat linear infinite;
    z-index:5;
}

@keyframes floatCat{
    0%{ transform:translateY(0px); }
    50%{ transform:translateY(-15px); }
    100%{ transform:translateY(0px); }
}

/* Her Video */
.herVideo{
    position:absolute;
    width:60%;
    max-width:300px;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    z-index:15;
    border-radius:10px;
}

/* Chaos text beneath her video */
#chaosText{
    position:absolute;
    top:65%;
    width:100%;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:yellow;
    padding:0 20px;
    box-sizing:border-box;
    z-index:20;
}

/* Flash chaos effect */
.flash{
    position:fixed;
    width:100vw;
    height:100vh;
    background:white;
    opacity:0;
    pointer-events:none;
    animation:flashAnim 0.2s linear infinite;
    z-index:999;
}

@keyframes flashAnim{
    0%{ opacity:0; }
    50%{ opacity:0.1; }
    100%{ opacity:0; }
}

/* Confetti */
.confetti{
    position:absolute;
    width:8px;
    height:8px;
    pointer-events:none;
    opacity:0.9;
    border-radius:50%;
    animation:fall 3s linear infinite;
    z-index:25;
}

@keyframes fall{
    0%{ transform:translateY(-10px) rotate(0deg); }
    100%{ transform:translateY(100vh) rotate(360deg); }
}

/* CONFESSION TEXT */
#confession{
    width:90%;
    max-width:600px;
    text-align:left;
    font-size:18px;
    line-height:1.6;
    background:rgba(255,255,255,0.1);
    padding:25px;
    border-radius:15px;
    color:#fff;
    white-space:pre-wrap;
    margin:20px auto;
    max-height:70vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

/* Secret Menu */
#secretMenu h2 {
    font-size:24px;
    margin-bottom:20px;
}

/* Reflection text */
.reflection-text {
    position:absolute;
    top:20%;
    width:90%;
    left:5%;
    text-align:center;
    font-size:20px;
    color:white;
    padding:20px;
    box-sizing:border-box;
    background:rgba(0,0,0,0.8);
    border-radius:15px;
    max-height:70vh;
    overflow-y:auto;
}

.error-message {
    color: #ff6b6b;
    margin-top: 10px;
    font-size: 14px;
}

#codeError {
    color: #ff6b6b;
    margin-top: 10px;
    font-size: 14px;
    min-height: 20px;
}

/* Success message style */
.success-message {
    color: #4CAF50;
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>

<body>
<!-- LOADING SCREEN -->
<div id="loadingScreen">
    <div class="loader"></div>
    <div id="loadingText">Loading media files... (0/5)</div>
    <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="errorContainer" class="error-message"></div>
</div>

<!-- AUDIO -->
<audio id="tap" preload="auto"></audio>
<audio id="meme" preload="auto"></audio>

<!-- SECRET MENU -->
<div id="secretMenu" class="screen center">
    <h2>Enter code for the main menu?</h2>
    <h2> (increase volume)</h2>
    <input type="password" id="codeInput" placeholder="Enter code" autocomplete="off">
    <button onclick="checkCode()">Enter</button>
    <button class="secondary" onclick="startMain()">Continue without code</button>
    <div id="codeError"></div>

<!-- MAIN SCENE -->
<div id="scene1" class="screen hidden"></div>

<!-- CONFESSION SCREEN (unchanged but unused for code path now) -->
<div id="confessionScreen" class="screen hidden center">
    <div id="confession"></div>
    <button onclick="goBackToMain()" style="margin-top:20px; background:#666; color:white;">← Back</button>
</div>

<script>

        newWindow.document.write(`
        <html>

            body {
                margin:0;
                background:black;
    ` + `
                color:white;

                display:flex;

            }
            #confession {
                max-width:600px;

        </style>
        </head>
        <body>

        <div id="confession"></div>

        <script>
        const text = \`This is the last menu I swear lol, it's nice that you were able to decrypt that. Now... how do I start?

        let i = 0;

</script>

</body>
</html>
